name: Test

on:
  push:
    branches:
      - main
      - canary
  pull_request:
    types:
      - opened
      - synchronize

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run image
        uses: abatilo/actions-poetry@v3
        with:
          poetry-version: "latest"

      - name: Test
        run: poetry run pytest -vra -m "not integration"