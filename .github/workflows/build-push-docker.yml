name: Create and publish Docker image

on:
  push:
    branches:
      - canary        # canary: build on every commit, overwrite :canary
    tags:
      - '*.*.*'       # releases: build only when a new version tag is pushed

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: privateaim/node-pod-orchestration

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(grep -m1 '^version' pyproject.toml | cut -d '"' -f2)
          if [[ "$GITHUB_REF_NAME" != "$VERSION" ]]; then
            echo "::error::Git tag ($GITHUB_REF_NAME) does not match pyproject.toml version ($VERSION)"
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=canary,enable=${{ github.ref == 'refs/heads/canary' }}
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}