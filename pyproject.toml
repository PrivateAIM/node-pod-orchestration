[tool.poetry]
name = "Node-Pod-Orchestration"
version = "0.6.3"
description = ""
authors = ["Alexander Röhl <alexander.roehl@uni-tuebingen.de>", "David Hieber <david.hieber@uni-tuebingen.de>"]
license = "Apache 2.0"
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
kubernetes = "^36.0.3"
fastapi = "^0.139.2"
uvicorn = "^0.51.0"
docker = "^7.2.0"
psycopg2-binary = "^2.9.9"
sqlalchemy = "^2.0.51"
PyJWT = "^2.13.0"
python-dotenv = "^1.2.2"
kong-admin-client = {git = "https://github.com/PrivateAIM/kong-admin-python-client.git"}
flame-hub-client = "^0.5.0"
httpx2 = "^2.9.1"
cryptography=">=49,<51"
truststore = "^0.10.4"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
ruff = "^0.15.22"
pre-commit = "^4.5.1"
coverage = "^7.15.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
